<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kindness Is Not Magic</title>
  <style>
    :root {
      font-family: "Trebuchet MS", "Avenir Next", Avenir, "Segoe UI", sans-serif;
      color: #e9dfc8;
      background: #6f8664;
    }

    html, body, #app {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(233,223,200,0.08), transparent 34%),
        linear-gradient(180deg, #748b69 0%, #667b5e 100%);
    }

    #app {
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
    }

    #app::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: 0.16;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.22) 0 0.7px, transparent 0.8px),
        radial-gradient(circle at 70% 60%, rgba(70,84,63,0.20) 0 0.7px, transparent 0.8px);
      background-size: 7px 7px, 9px 9px;
      mix-blend-mode: soft-light;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }

    #lyrics {
      position: absolute;
      left: 7vw;
      right: 7vw;
      bottom: 9vh;
      z-index: 5;
      max-width: 86vw;
      font-size: clamp(42px, 5.6vw, 104px);
      font-weight: 760;
      letter-spacing: -0.03em;
      line-height: 1.02;
      text-wrap: balance;
      text-shadow: 0 2px 0 rgba(63,77,58,0.28), 0 8px 24px rgba(63,77,58,0.16);
      pointer-events: none;
    }

    .word {
      color: rgba(213,194,161,0.64);
      transition: color 80ms linear, opacity 80ms linear;
    }

    .word.done {
      color: #f1e7d2;
    }

    .word.active {
      color: #d7a84c;
    }

    #annotation {
      position: absolute;
      top: 10vh;
      right: 8vw;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: clamp(10px, 1vw, 16px);
      color: #d5c2a1;
      opacity: 0;
      pointer-events: none;
    }

    #annotation::before {
      content: "↳ ";
      color: #d7a84c;
    }

    #plate-label {
      position: absolute;
      top: 9vh;
      left: 7vw;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(10px, 0.95vw, 15px);
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #9c978f;
      opacity: 0;
      transition: opacity 120ms linear;
      pointer-events: none;
    }

    #plate-label::before {
      content: "MECHANISM  ";
      color: #5d7256;
    }

    #center-title {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(72px, 13vw, 250px);
      font-weight: 800;
      text-shadow: 0 3px 0 rgba(63,77,58,0.24), 0 10px 32px rgba(63,77,58,0.18);
      letter-spacing: -0.065em;
      color: #f1e7d2;
      opacity: 0;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
