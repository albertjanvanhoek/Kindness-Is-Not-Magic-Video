<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kindness Is Not Magic</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eee9df;
      background: #0b0b0c;
    }

    html, body, #app {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0c;
    }

    #app {
      display: grid;
      place-items: center;
      position: relative;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }

    #lyrics {
      position: absolute;
      left: 7vw;
      right: 7vw;
      bottom: 11vh;
      font-size: clamp(34px, 5vw, 92px);
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 0.95;
      pointer-events: none;
    }

    .word {
      color: #5e5b57;
      transition: color 80ms linear;
    }

    .word.done {
      color: #eee9df;
    }

    .word.active {
      color: #ff7a3d;
    }

    #annotation {
      position: absolute;
      top: 10vh;
      right: 8vw;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: clamp(10px, 1vw, 16px);
      color: #9c978f;
      opacity: 0;
      pointer-events: none;
    }

    #annotation::before {
      content: "↳ ";
      color: #ff7a3d;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
