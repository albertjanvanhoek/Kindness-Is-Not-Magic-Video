name: render preview

on:
  workflow_dispatch:
    inputs:
      segment:
        description: Preview section
        required: true
        default: opening
        type: choice
        options:
          - opening
          - mechanisms
          - payoff
          - repair
          - final-third
          - first-half
          - second-half
          - full
      resolution:
        description: Output resolution
        required: true
        default: 1080p
        type: choice
        options:
          - 720p
          - 1080p

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app
        working-directory: app
        run: npm install

      - name: Use preinstalled Chrome
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Install ffmpeg tools
        working-directory: app
        run: |
          npx playwright install ffmpeg
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Build renderer
        working-directory: app
        run: npm run build

      - name: Start preview server
        working-directory: app
        run: |
          npm run preview > /tmp/kindness-vite.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kindness-vite.log
          exit 1

      - name: Resolve segment
        id: segment
        shell: bash
        run: |
          case "${{ inputs.segment }}" in
            opening)     echo "start=0" >> "$GITHUB_OUTPUT"; echo "end=26" >> "$GITHUB_OUTPUT" ;;
            mechanisms)  echo "start=26.7" >> "$GITHUB_OUTPUT"; echo "end=38.6" >> "$GITHUB_OUTPUT" ;;
            payoff)      echo "start=34" >> "$GITHUB_OUTPUT"; echo "end=61.95" >> "$GITHUB_OUTPUT" ;;
            repair)      echo "start=61.9" >> "$GITHUB_OUTPUT"; echo "end=82.25" >> "$GITHUB_OUTPUT" ;;
            final-third) echo "start=82.15" >> "$GITHUB_OUTPUT"; echo "end=137.3" >> "$GITHUB_OUTPUT" ;;
            first-half)  echo "start=0" >> "$GITHUB_OUTPUT"; echo "end=71.5" >> "$GITHUB_OUTPUT" ;;
            second-half) echo "start=71.0" >> "$GITHUB_OUTPUT"; echo "end=139.24" >> "$GITHUB_OUTPUT" ;;
            full)        echo "start=0" >> "$GITHUB_OUTPUT"; echo "end=139.24" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Resolve resolution
        id: resolution
        shell: bash
        run: |
          case "${{ inputs.resolution }}" in
            720p)  echo "width=1280" >> "$GITHUB_OUTPUT"; echo "height=720" >> "$GITHUB_OUTPUT" ;;
            1080p) echo "width=1920" >> "$GITHUB_OUTPUT"; echo "height=1080" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Render MP4
        working-directory: app
        run: |
          npm run render:preview -- \
            --start "${{ steps.segment.outputs.start }}" \
            --end "${{ steps.segment.outputs.end }}" \
            --name "${{ inputs.segment }}" \
            --width "${{ steps.resolution.outputs.width }}" \
            --height "${{ steps.resolution.outputs.height }}"

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: kindness-${{ inputs.segment }}
          path: |
            app/rendered/${{ inputs.segment }}/*.mp4
          retention-days: 14
